# The whole bot, with one command: docker compose up
# (For local development, compose.dev.yml runs the database alone.)
name: forest-bot

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forest}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<version>/.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    # A tiny init process as PID 1 passes `docker stop` on to the start command: sh alone
    # would ignore it while the archive is being seeded, and be killed after 10 seconds.
    init: true
    # Tokens and settings, read when the container starts; never part of the image.
    env_file: .env
    environment:
      # The database container by its service name (.env has the address used on the host).
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      # The embedding model, downloaded on the first start and kept across rebuilds.
      - models:/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
