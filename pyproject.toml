[project]
name = "forest-bot"
version = "0.1.0"
description = "Telegram bot that answers forest animals' questions from their shared advice documents (RAG)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "pgvector>=0.3.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-docx>=1.1.2",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "alembic>=1.20.0",
    "asyncpg>=0.30",
    "sentence-transformers>=5.1",
    "torch>=2.9",
    "langchain-text-splitters>=1.0",
    "langchain-groq>=1.0",
    "aiogram>=3.31",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

# CPU-only torch: the default Linux wheels bundle CUDA (several GB in the Docker image).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forest_bot"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
